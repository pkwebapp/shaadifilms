customHeaders:
  - pattern: '**'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '/assets/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
